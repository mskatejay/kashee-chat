<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 1080px;
    background: transparent;
    overflow: hidden;
}

#chat {
    position: absolute;
    right: 50px;
    bottom: 50px;
    color: white;
    font: 28px Arial, sans-serif;
}
</style>
</head>

<body>

<div id="chat">CZEKAM NA WIADOMOŚĆ...</div>

<script>
moblin.publish({ videoPlaying: true });
moblin.subscribe({ chat: {} });

moblin.onmessage = function(message) {
    if (message.chat) {
        document.getElementById("chat").innerText =
            JSON.stringify(message.chat);
    }
};
</script>

</body>
</html>

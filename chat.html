<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 1080px;
    background: transparent;
    overflow: hidden;
}

#chat {
    position: absolute;
    right: 50px;
    bottom: 50px;
    width: 650px;

    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;

    font-family: Arial, sans-serif;
    font-size: 28px;
}

.message {
    padding: 10px 16px;
    background: rgba(0, 0, 0, 0.75);
    border-radius: 12px;
    color: white;
    animation: appear 0.2s ease-out;
}

.user {
    font-weight: bold;
    margin-right: 8px;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateX(20px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}
</style>
</head>

<body>

<div id="chat"></div>

<script>
moblin.publish({ videoPlaying: true });
moblin.subscribe({ chat: {} });

const chat = document.getElementById("chat");

moblin.onmessage = function(message) {

    if (!message.chat) return;

    const user = message.chat.user || "";

    const text = (message.chat.segments || [])
        .map(function(segment) {
            return segment.text || "";
        })
        .join("");

    if (!text) return;

    const item = document.createElement("div");
    item.className = "message";

    const username = document.createElement("span");
    username.className = "user";
    username.textContent = user + ":";

    item.appendChild(username);
    item.appendChild(
        document.createTextNode(" " + text)
    );

    chat.appendChild(item);

    while (chat.children.length > 6) {
        chat.removeChild(chat.firstChild);
    }
};
</script>

</body>
</html>

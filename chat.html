<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 1080px;
    background: transparent;
    overflow: hidden;
}

#chat {
    position: absolute;
    right: 60px;
    bottom: 60px;
    width: 800px;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 32px;
    font-weight: 600;
    text-shadow: 2px 2px 4px black;
}
</style>
</head>

<body>

<div id="chat">CHAT TEST</div>

<script>
moblin.publish({ videoPlaying: true });

moblin.subscribe({ chat: {} });

moblin.onmessage = function(message) {

    if (message.chat !== undefined) {

        document.getElementById("chat").innerText =
            JSON.stringify(message.chat);
    }
};
</script>

</body>
</html>

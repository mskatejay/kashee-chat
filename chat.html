<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 1080px;
    background: transparent;
    overflow: hidden;
}

#chat {
    position: absolute;
    right: 60px;
    bottom: 60px;
    width: 500px;
    color: white;
    font-family: Arial, sans-serif;
}
</style>
</head>

<body>
<div id="chat">CHAT TEST</div>

<script>
moblin.subscribe({ chat: {} });

moblin.onmessage = function(message) {
    if (message.chat !== undefined) {
        document.getElementById("chat").innerText =
            message.chat.user + ": " +
            message.chat.segments.map(x => x.text || "").join("");
    }
};
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 1080px;
    background: transparent;
    overflow: hidden;
}

#chat {
    position: absolute;
    right: 50px;
    bottom: 50px;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 30px;
}
</style>
</head>

<body>

<div id="chat">CHAT TEST</div>

<script>
moblin.publish({ videoPlaying: true });

moblin.subscribe({ chat: {} });

moblin.onmessage = function(message) {
    document.getElementById("chat").innerText =
        "MESSAGE: " + JSON.stringify(message);
};
</script>

</body>
</html>
